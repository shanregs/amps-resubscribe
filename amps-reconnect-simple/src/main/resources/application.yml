spring:
  application:
    name: amps-reconnect-simple

# For local primary/secondary failover testing (e.g. two ampServer instances in WSL on different
# ports), list both URIs — see docs/HA_AMPS_LAB_SETUP_GUIDE.md.
#
# client-count HAClients are created in code (CLIENT_1..CLIENT_N), all subscribed to the same
# queue below — that's what gives parallel processing of the queue.
amps:
  uris:
    - tcp://172.21.12.69:9007/amps/json
    - tcp://172.21.12.69:9107/amps/json
  queue: orders.queue
  client-count: 3

logging:
  level:
    com.bmo.amps.simple: INFO

