spring:
  application:
    name: amps-resubscribe

# For local primary/secondary failover testing (e.g. two ampServer instances in WSL on different
# ports), list both URIs under each client — see docs/HA_AMPS_LAB_SETUP_GUIDE.md.
amps:
  clients:
    - type: CLIENT_1
      uris:
        - tcp://localhost:9007/amps/json
        - tcp://localhost:9017/amps/json
      queue: orders.queue
      retry:
        initial-delay: 500ms
        max-delay: 30s
        multiplier: 2.0
    - type: CLIENT_2
      uris:
        - tcp://localhost:9007/amps/json
        - tcp://localhost:9017/amps/json
      queue: fills.queue
      retry:
        initial-delay: 500ms
        max-delay: 30s
        multiplier: 2.0
    - type: CLIENT_3
      uris:
        - tcp://localhost:9007/amps/json
        - tcp://localhost:9017/amps/json
      queue: risk.queue
      retry:
        initial-delay: 500ms
        max-delay: 30s
        multiplier: 2.0

logging:
  level:
    com.bmo.amps.resubscribe: INFO
